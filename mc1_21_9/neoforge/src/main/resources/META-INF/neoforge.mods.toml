modLoader = "javafml"
loaderVersion = "[1,)"
license = "MIT"
issueTrackerURL = "https://github.com/rivalzin/BetterSearch/issues"

[[mods]]
modId = "bettersearch"
version = "${version}"
displayName = "Better Search"
authors = "rivalzin"
displayURL = "https://www.youtube.com/@Rivalzln"
logoFile = "SearchIconNEWICON512x512.png"
# Pixel art: sem suavizacao, para o icone ficar nitido na lista de mods.
logoBlur = false
description = '''
Makes search bars smarter and better!
'''

# Client-only: o mod nao precisa estar no servidor.
[[mixins]]
config = "bettersearch.mixins.json"

[[dependencies.bettersearch]]
modId = "neoforge"
type = "required"
# Linhas 21.9 e 21.10 - ou seja, Minecraft 1.21.9 e 1.21.10. A 1.21.10 foi so correcao de
# bugs: mesma API de cliente e mesmo formato de pacote de recursos (69.0), entao um jar so
# serve as duas. A 1.21.11 fica DE FORA de proposito: la o ResourceLocation virou Identifier
# e o mod nem compila; ela ganha o proprio jar.
versionRange = "[21.9.0,21.11)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.bettersearch]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.9,1.21.11)"
ordering = "NONE"
side = "CLIENT"
