# Daemon do Gradle em Java 25 - e a forma oficial do Gradle 9 de fixar isso por projeto.
#
# Por que: o RetroFuturaGradle (modulo 1.12.2) e compilado para Java 25; carregado por um
# daemon em Java 21 ele morre com UnsupportedClassVersionError (class file 69 > 65) - provado
# na rodada 2 da sonda-1122. O proprio projeto ja documentava "o Java que RODA o Gradle
# precisa ser 25" desde a linha 26.x; este arquivo transforma a recomendacao em garantia.
#
# O Gradle procura um JDK 25 instalado (JAVA_HOME, PATH, registro, ~/.gradle/jdks). Nesta
# maquina o java do PATH ja e o Temurin 25.0.4 - visto no diagnostico da sonda.
toolchainVersion=25
