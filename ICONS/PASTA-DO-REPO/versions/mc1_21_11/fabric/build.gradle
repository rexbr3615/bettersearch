plugins {
    // Versao ofuscada do Minecraft: quem serve e o plugin que remapeia.
    id 'net.fabricmc.fabric-loom-remap'
    id 'java-library'
    id 'idea'
}

version = mod_version
group = mod_group_id
base.archivesName = "${mod_id}-fabric-${minecraft_version_21111}"

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// Exatamente as mesmas pastas que o NeoForge compila - nem um arquivo a mais, nem um a menos.
sourceSets {
    main {
        java.srcDir rootProject.file('core/src/main/java')
        java.srcDir file('../common/src/main/java')
        resources.srcDir file('../common/src/main/resources')
    }
}

repositories {
    maven { name = 'EMI'; url = 'https://maven.terraformersmc.com/releases' }
    maven { name = 'Shedaniel'; url = 'https://maven.shedaniel.me/' }
    maven { name = 'BlameJared'; url = 'https://maven.blamejared.com/' }
    mavenCentral()
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/'
    }
}

dependencies {
    // Gancho da busca do EMI. O EMI so publica ate a 1.21.1, entao aqui compilamos contra
    // aquele jar mesmo: se alguem portar o EMI para esta versao, o gancho ja esta pronto, e
    // sem o EMI instalado o plugin do mixin nem carrega nada disto.
    // compileOnly com o artefato do neoforge de proposito: ele vem em nomes da Mojang, serve
    // aos dois loaders como referencia de API e nao passa por remapeamento nenhum.
    compileOnly("dev.emi:emi-neoforge:${emi_version}") { transitive = false }
    // Gancho da busca do REI. So compilacao: mira em classes internas dele e o
    // jar dele nunca entra no nosso.
    // modCompileOnly: o jar do REI chega em outro namespace e o plugin traduz.
    modCompileOnly("me.shedaniel:RoughlyEnoughItems-fabric:${rei_version_21111}")
    // Gancho da busca do JEI. So compilacao: mira em classe interna dele, que nao esta na
    // API publica, e o jar dele nunca entra no nosso.
    // modCompileOnly e nao compileOnly: aqui o jar do JEI chega em outro namespace (intermediary
    // no Fabric, SRG no Forge 1.20.1) e quem traduz para os nomes do ambiente e essa configuracao.
    // Com compileOnly puro o javac reclama de net.minecraft.class_2960 e nao compila.
    modCompileOnly("mezz.jei:jei-${jei_mc_21111}-fabric:${jei_version_21111}")
    minecraft "com.mojang:minecraft:${minecraft_version_21111}"

    /*
     * Mojang mappings, e nao Yarn - esta e A decisao que faz o port sair de graca.
     *
     * O NeoForge usa nomes oficiais da Mojang. Escolhendo o mesmo aqui, "Screen" continua
     * "Screen" e "GuiGraphics" continua "GuiGraphics" nos dois lados, entao as 2.197 linhas
     * de client/ e client/gui/ e os 3 mixins sao literalmente o mesmo arquivo. Com Yarn, cada
     * classe teria outro nome e seria preciso manter duas copias de tudo.
     */
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version_21111}"

    // Opcional: so para o botao de config na lista de mods. O mod funciona sem ele.
    modCompileOnly "com.terraformersmc:modmenu:${modmenu_version_21111}"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

jar {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${mod_id}" }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
