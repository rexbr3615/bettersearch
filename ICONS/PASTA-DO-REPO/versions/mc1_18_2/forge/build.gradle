plugins {
    id 'net.neoforged.moddev.legacyforge'
    id 'java-library'
    id 'idea'
}

version = mod_version
group = mod_group_id
base.archivesName = "${mod_id}-forge-1.18.2"

// 1.18.2 roda em Java 17. O Gradle baixa este JDK sozinho se voce nao tiver.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

/*
 * Mesmo arranjo dos outros loaders: o core/ (o algoritmo) e o common/ da 1.20.1 entram como
 * pasta de fonte e sao compilados dentro deste jar. Nao ha subprojeto, nao ha shadow.
 *
 * O gancho do EMI e a excecao desta versao, e por isso ele NAO esta no common/: nesta linha
 * o EMI so tem lancamento de Fabric. Nao e que a dependencia esteja faltando aqui - ela nao
 * existe. O jar de Fabric do EMI 0.7.3 tambem nao serve para compilar contra, porque traz o
 * Minecraft em nomes intermediary (net.minecraft.class_1799 no lugar de ItemStack).
 *
 * Entao os quatro arquivos daquele gancho moram em ../fabric/src/main/, e nao no common/.
 * Poderiam ficar no common/ com um "exclude" aqui, mas exclude e comportamento do Gradle, e
 * comportamento do Gradle nao da para conferir sem rodar o Gradle - o que este projeto nao
 * consegue fazer offline. Mover o arquivo de pasta e um fato do disco: a conferencia enxerga.
 *
 * A opcao do EMI continua aparecendo no menu nas duas, porque ela mora no core/ e nao depende
 * de mod nenhum. O que nao da para ter aqui e o gancho.
 */
sourceSets {
    main {
        java.srcDir rootProject.file('core/src/main/java')
        java.srcDir file('../common/src/main/java')
        resources.srcDir file('../common/src/main/resources')
    }
}

repositories {
    maven { name = 'Shedaniel'; url = 'https://maven.shedaniel.me/' }
    maven { name = 'EMI'; url = 'https://maven.terraformersmc.com/releases' }
    // onde o JEI publica. so compilacao, o jar dele nao entra no nosso
    maven { name = 'BlameJared'; url = 'https://maven.blamejared.com/' }
    mavenCentral()
    // Onde mora o processador de anotacoes do Mixin.
    maven {
        name = 'SpongePowered'
        url = 'https://repo.spongepowered.org/repository/maven-public/'
    }
}

dependencies {
    // Gancho da busca do REI. So compilacao: mira em classes internas dele e o
    // jar dele nunca entra no nosso.
    // modCompileOnly: o jar do REI chega em outro namespace e o plugin traduz.
    modCompileOnly("me.shedaniel:RoughlyEnoughItems-forge:${rei_version_1182}")
    // O EMI nao tem lancamento para Forge na 1.18.2, entao aqui nao ha o que compilar
    // contra - nem gancho a registrar. No Fabric ele existe e esta ligado.
    // Gancho da busca do JEI. So compilacao: mira em classe interna dele, que nao esta na
    // API publica, e o jar dele nunca entra no nosso.
    // modCompileOnly e nao compileOnly: aqui o jar do JEI chega em outro namespace (intermediary
    // no Fabric, SRG no Forge 1.20.1) e quem traduz para os nomes do ambiente e essa configuracao.
    // Com compileOnly puro o javac reclama de net.minecraft.class_2960 e nao compila.
    modCompileOnly("mezz.jei:jei-${jei_mc_1182}-forge:${jei_version_1182}")
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    /*
     * Diferenca central entre o Forge 1.20.1 e o NeoForge 1.21.1: o jogo, em producao, roda
     * com nomes SRG (ofuscados). O Mixin nao tem como achar "refreshSearchResults" ali - ele
     * precisa de um mapa, o "refmap", que este processador de anotacoes gera em tempo de
     * compilacao. Sem isso o mod compila, instala e nao faz nada.
     */
}

legacyForge {
    version = project.forge_version_1182

    runs {
        client {
            client()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

mixin {
    // Gera o refmap e o coloca dentro do jar. O nome tem de ser o mesmo que esta escrito no
    // campo "refmap" do bettersearch-forge.mixins.json.
    add sourceSets.main, 'bettersearch.refmap.json'
    // Faz os mixins carregarem tambem no ambiente de desenvolvimento (./gradlew runClient).
    config 'bettersearch-forge.mixins.json'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') {
        expand version: project.version
    }
    /*
     * O bettersearch.mixins.json vem junto da pasta comum, mas ele e o arquivo do Fabric: la
     * quem escreve o campo "refmap" e o Loom, na hora de remapear. Aqui quem vale e o
     * bettersearch-forge.mixins.json, que ja traz o refmap escrito. Ter os dois no jar so
     * confundiria quem for abrir o arquivo.
     */
    exclude 'bettersearch.mixins.json'
}

jar {
    manifest {
        attributes([
                // Sem esta linha os mixins simplesmente nao carregam no jogo de verdade.
                // O [[mixins]] do mods.toml so existe no NeoForge 20.2+; na 1.20.1 e aqui.
                // Sem o do EMI: nesta versao o gancho dele nao entra neste jar (veja o
                // comentario no sourceSets la em cima). Anunciar um arquivo de mixin que nao
                // esta dentro do jar faz o Mixin reclamar na inicializacao.
                'MixinConfigs'           : 'bettersearch-forge.mixins.json,bettersearch-jei.mixins.json,bettersearch-rei.mixins.json',
                'Specification-Title'    : mod_name,
                'Specification-Vendor'   : mod_authors,
                'Specification-Version'  : project.version,
                'Implementation-Title'   : mod_name,
                'Implementation-Version' : project.version,
                'Implementation-Vendor'  : mod_authors
        ])
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
