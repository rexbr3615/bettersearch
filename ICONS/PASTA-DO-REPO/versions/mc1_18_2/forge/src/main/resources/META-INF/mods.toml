modLoader = "javafml"
# Na 1.20.1 este numero e a versao do Forge (47). O NeoForge daquela linha tambem se anuncia
# como 47.x, entao "[47,)" e aceito pelos dois - e e o unico jeito de um jar so servir aos
# dois loaders.
loaderVersion = "[40,)"
license = "MIT"
issueTrackerURL = "https://github.com/rivalzin/BetterSearch/issues"

[[mods]]
modId = "bettersearch"
version = "${version}"
displayName = "Better Search"
authors = "rivalzin"
displayURL = "https://www.youtube.com/@Rivalzln"
logoFile = "SearchIconNEWICON512x512.png"
# Pixel art: sem suavizacao, para o icone ficar nitido na lista de mods.
logoBlur = false
# Mod so de cliente: entrar em servidor sem ele nao muda nada, entao nao ha por que o
# servidor reclamar que voce tem um mod a mais.
displayTest = "IGNORE_ALL_VERSION"
description = '''
Makes search bars smarter and better!
'''

# Onde ficam os mixins: no Forge 1.20.1 quem manda e o atributo MixinConfigs do manifesto do
# jar (veja o build.gradle). O bloco [[mixins]] deste arquivo so passou a existir no NeoForge
# 20.2 em diante, entao ele nao entra aqui.

[[dependencies.bettersearch]]
modId = "forge"
mandatory = true
# "[47,)" e nao "[47.4,)": o NeoForge da 1.20.1 parou no 47.1.106. Um limite inferior mais
# alto que isso derrubaria o mod la, sem ganhar nada aqui.
versionRange = "[40,)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.bettersearch]]
modId = "minecraft"
mandatory = true
# So a 1.18.2. Um limite superior AQUI nao e frescura: sem ele o loader deixa o mod carregar
# em 1.20.4, 1.21, no que vier - e ai os mixins nao acham os alvos e o jogo quebra na cara do
# jogador. Cada versao portada ganha o proprio jar.
versionRange = "[1.18.2,1.19)"
ordering = "NONE"
side = "CLIENT"
