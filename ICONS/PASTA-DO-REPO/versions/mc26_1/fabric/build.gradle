plugins {
    // A partir da 26.1 o Minecraft nao vem mais ofuscado: nao ha o que remapear, entao
    // quem serve e o Loom "puro". O jar sai da tarefa jar, e nao mais da remapJar.
    id 'net.fabricmc.fabric-loom'
    id 'java-library'
    id 'idea'
}

version = mod_version
group = mod_group_id
base.archivesName = "${mod_id}-fabric-${minecraft_version_261}"

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// Exatamente as mesmas pastas que o NeoForge compila - nem um arquivo a mais, nem um a menos.
sourceSets {
    main {
        java.srcDir rootProject.file('core/src/main/java')
        java.srcDir file('../common/src/main/java')
        resources.srcDir file('../common/src/main/resources')
    }
}

repositories {
    maven { name = 'EMI'; url = 'https://maven.terraformersmc.com/releases' }
    maven { name = 'Shedaniel'; url = 'https://maven.shedaniel.me/' }
    maven { name = 'BlameJared'; url = 'https://maven.blamejared.com/' }
    mavenCentral()
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/'
    }
}

dependencies {
    // Gancho da busca do EMI. O EMI so publica ate a 1.21.1, entao aqui compilamos contra
    // aquele jar mesmo: se alguem portar o EMI para esta versao, o gancho ja esta pronto, e
    // sem o EMI instalado o plugin do mixin nem carrega nada disto.
    // compileOnly com o artefato do neoforge de proposito: ele vem em nomes da Mojang, serve
    // aos dois loaders como referencia de API e nao passa por remapeamento nenhum.
    compileOnly("dev.emi:emi-neoforge:${emi_version}") { transitive = false }
    // Gancho da busca do REI. So compilacao: mira em classes internas dele e o
    // jar dele nunca entra no nosso.
    // compileOnly basta: aqui o jar ja vem em nomes da Mojang.
    compileOnly("me.shedaniel:RoughlyEnoughItems-fabric:${rei_version_261}") { transitive = false }
    // Gancho da busca do JEI. So compilacao: mira em classe interna dele, que nao esta na
    // API publica, e o jar dele nunca entra no nosso.
    // compileOnly basta: neoforge e o fabric da 26.x ja entregam o jar em nomes da Mojang.
    compileOnly("mezz.jei:jei-${jei_mc_261}-fabric:${jei_version_261}") { transitive = false }
    minecraft "com.mojang:minecraft:${minecraft_version_261}"

    /*
     * Nao ha linha de "mappings" aqui, e isso nao e esquecimento: a Mojang tirou a ofuscacao
     * na 26.1, entao os nomes ja sao os oficiais e nao existe mapeamento a escolher. Pelo
     * mesmo motivo as dependencias entram como implementation, e nao modImplementation.
     */
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version_261}"

    // Opcional: so para o botao de config na lista de mods. O mod funciona sem ele.
    compileOnly "com.terraformersmc:modmenu:${modmenu_version_261}"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

jar {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${mod_id}" }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
