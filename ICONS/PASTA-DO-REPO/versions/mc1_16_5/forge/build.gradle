plugins {
    /*
     * Architectury Loom, e nao ModDevGradle.
     *
     * O ModDevGradle legacy cobre de 1.17 a 1.20.1 - a 1.16.5 fica de fora. E o ForgeGradle 5,
     * que seria o plugin oficial desta versao, recusa o Gradle 9: "Found Gradle version Gradle
     * 9.6.1. Versions Gradle 8.0 and newer are not supported." Os dois foram testados na
     * ferramentas/sonda-1165, nao deduzidos.
     *
     * O Architectury Loom e um fork do Fabric Loom - a mesma geracao (1.17.x) do plugin que os
     * oito modulos Fabric ja usam - e cobre Forge a partir da 1.16 com mapeamentos da Mojang.
     * A sonda provou que ele configura no Gradle 9.6.1 E que convive com o Fabric Loom no
     * mesmo build sem a propriedade loom.platform vazar de um modulo para o outro.
     */
    id 'dev.architectury.loom'
    id 'java-library'
    id 'idea'
}

version = mod_version
group = mod_group_id
base.archivesName = "${mod_id}-forge-1.16.5"

// 1.16.5 roda em Java 8. O Gradle baixa este JDK sozinho (veja o foojay-resolver no
// settings.gradle da raiz).
java.toolchain.languageVersion = JavaLanguageVersion.of(8)

/*
 * Mesmo arranjo das outras versoes: core/ (o algoritmo) e common/ entram como pasta de fonte.
 *
 * Repare no que NAO esta aqui: os ganchos do JEI e do REI. Nesta versao eles moram em
 * _integracoes-pendentes/, fora de qualquer pasta de fonte - o JEI 7.8.1 e o REI 6.5.436 sao
 * de outra epoca da API e o gancho de hoje nao compila contra eles. Veja o LEIA-ME de la.
 * A opcao dos tres continua aparecendo no menu, porque ela mora no core/.
 */
sourceSets {
    main {
        java.srcDir rootProject.file('core/src/main/java')
        java.srcDir file('../common/src/main/java')
        resources.srcDir file('../common/src/main/resources')
    }
}

repositories {
    maven { name = 'Forge'; url = 'https://maven.minecraftforge.net/' }
    // Onde o Shedaniel publica o REI. A secao 17 do verify.sh cobra esta linha: declarar a
    // dependencia sem o repositorio dela nao aparece em compilacao nenhuma, so quando o
    // Gradle vai baixar - foi o que quebrou o modulo Fabric.
    maven { name = 'Shedaniel'; url = 'https://maven.shedaniel.me/' }
    // Onde o JEI publica.
    maven { name = 'BlameJared'; url = 'https://maven.blamejared.com/' }
    maven { name = 'SpongePowered'; url = 'https://repo.spongepowered.org/repository/maven-public/' }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:1.16.5"
    /*
     * O metodo mora na extensao do plugin, e o nome dessa extensao mudou de "minecraft" para
     * "loom" ao longo da vida do Loom. Em vez de apostar em um dos dois, pergunto ao projeto
     * qual existe - custa uma linha e nao tem como estar errado.
     */
    def ext = project.extensions.findByName('loom') ?: project.extensions.getByName('minecraft')
    mappings ext.officialMojangMappings()
    forge "net.minecraftforge:forge:${forge_version_1165}"

    /*
     * Gancho da busca do REI. So compilacao: o jar dele nunca entra no nosso.
     *
     * Aqui e a linha 6.5, que ja e a API moderna (SearchProviderImpl.createFilter) - e nao a
     * 5.x do Fabric desta mesma versao do Minecraft, que e outra base de codigo inteira. As
     * duas diferencas que importam foram lidas com javap no jar, nao deduzidas:
     *   - createFilter aqui tem UM argumento; da 1.18.2 em diante sao dois (ganhou InputMethod)
     *   - EntryListSearchManager.copyAndOrder nao existe nesta linha: quem entrega a lista ja
     *     filtrada e o AsyncSearchManager.get()
     *
     * modCompileOnly e nao compileOnly: o jar do REI vem em nomes MCP (ResourceLocation,
     * CompoundNBT) e este modulo compila em Mojang mappings (net.minecraft.resources.
     * ResourceLocation, CompoundTag). Quem traduz e o Architectury Loom.
     *
     * transitive = false pelo mesmo motivo do modulo Fabric: nao arrastar a arvore de
     * dependencias do REI para dentro de um build que nao declara os repositorios dela.
     */
    modCompileOnly("me.shedaniel:RoughlyEnoughItems-forge:${rei_version_1165_forge}") { transitive = false }

    /*
     * Gancho da busca do JEI. So compilacao, como o do REI.
     *
     * A linha aqui e a 7.8, anterior a separacao do JEI em "common": a classe interna e
     * mezz.jei.ingredients.IngredientFilter (e nao mezz.jei.common.ingredients), o elemento e
     * IIngredientListElementInfo (o ITypedIngredient nem existe) e o campo elementSearch NAO e
     * final. Tudo conferido com javap - veja o comentario do IngredientFilterMixin.
     */
    modCompileOnly("mezz.jei:jei-${jei_mc_1165}:${jei_version_1165}") { transitive = false }

    /*
     * NAO declare o annotationProcessor do Mixin aqui.
     *
     * Nos outros modulos Forge (1.18.2, 1.19.2, 1.20.1) ele existe porque la quem monta e o
     * ModDevGradle, e o refmap tem de ser gerado em compilacao. Aqui quem monta e o
     * Architectury Loom, e ele JA remapeia os mixins sozinho no remapJar - por isso este
     * modulo sempre funcionou em jogo mesmo com o aviso "refmap could not be read" no log.
     *
     * Declarando o processador, ele exige o mapa MCP->SRG que o Loom nao entrega para ele, e o
     * build morre em cima dos mixins que ja funcionavam:
     *
     *   error: No obfuscation mapping for @Inject target updateCommandInfo
     *   error: No obfuscation mapping for @Redirect target updateCollections
     *
     * Cobrado pela secao 20 do verify.sh.
     */
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    /*
     * NAO usar options.release aqui: --release nasceu no JDK 9 e a toolchain acima e Java 8,
     * entao quem compila e o javac do JDK 8 - ele responde "invalid flag: --release" e para
     * antes de compilar. Com a toolchain em 8 o bytecode ja sai em Java 8 por construcao.
     */
}

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') {
        expand version: project.version
    }
    // O arquivo de mixin do Fabric nao entra no jar do Forge (veja PORTING.md, secao do refmap).
    exclude 'bettersearch.mixins.json'
}

jar {
    manifest {
        attributes([
                // Sem o do JEI e o do REI: nesta versao esses ganchos nao entram no jar, e
                // anunciar um arquivo de mixin ausente faz o Mixin reclamar na inicializacao.
                // O do REI entra aqui tambem, senao o Mixin nunca le o arquivo e o gancho
                // nao existe em jogo - sem erro nenhum no log.
                'MixinConfigs'           : 'bettersearch-forge.mixins.json,bettersearch-jei.mixins.json,bettersearch-rei.mixins.json',
                'Specification-Title'    : mod_name,
                'Specification-Vendor'   : mod_authors,
                'Specification-Version'  : project.version,
                'Implementation-Title'   : mod_name,
                'Implementation-Version' : project.version,
                'Implementation-Vendor'  : mod_authors
        ])
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
