# Por que este arquivo existe:
#
# O RFG 2.x e compilado para JAVA 25 - a rodada 2 da sonda provou no bytecode
# (class file 69), e as notas de lancamento ja avisavam ("Java 25 requirement").
# O daemon do Gradle desta maquina roda em Java 21 (class file 65) - dai o
# UnsupportedClassVersionError.
#
# Esta e a forma oficial do Gradle 9 de pedir outro Java SO PARA ESTE build, sem
# mexer no JAVA_HOME nem nos outros builds: ele procura um JDK 25 instalado
# (inclusive os que o proprio Gradle baixou em ~/.gradle/jdks - o da linha 26.x
# do mod deve estar la) e forka o daemon nele.
toolchainVersion=25
