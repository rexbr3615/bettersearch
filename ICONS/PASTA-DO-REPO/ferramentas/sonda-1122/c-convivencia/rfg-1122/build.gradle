plugins {
    id 'java'
    /*
     * RetroFuturaGradle: a ferramenta da comunidade GTNH para montar 1.7.10/1.12.2 em Gradle
     * moderno. Tres fatos conferidos na fonte antes desta sonda existir:
     *
     *   - as notas da 2.0.0 (11/nov/2025) anunciam "Gradle 9 support, Java 25 requirement".
     *     O README que diz "gradle 7.6-8.8" descreve a linha 1.x, anterior;
     *   - o Java 25 e o que este projeto JA usa para rodar o Gradle (exigencia da linha 26.x);
     *   - o ID e a sintaxe abaixo vem do template 1.12.2 da CleanroomMC, nao de memoria.
     *
     * O que so esta maquina responde: se ele monta a 1.12.2 no Gradle 9.6.1 daqui.
     */
    id 'com.gtnewhorizons.retrofuturagradle' version '2.0.2'
}

// Quem compila e um JDK 8 baixado pelo foojay - mesmo desenho da 1.16.5.
java.toolchain.languageVersion = JavaLanguageVersion.of(8)

minecraft {
    mcVersion.set('1.12.2')
    /*
     * MCP stable_39: abaixo da 1.14.4 nao ha mapeamento da Mojang; e MCP ou nada. O artefato
     * de.oceanlabs.mcp:mcp_stable:39-1.12 existe no maven da Forge - conferido no
     * maven-metadata.xml de la, que so tem UMA versao contendo "1.12": a 39-1.12.
     */
    mcpMappingChannel.set('stable')
    mcpMappingVersion.set('39')
    username.set('Sonda')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // Sem options.release: toolchain 8, o javac do 8 nao conhece a flag. Licao da 1.16.5.
}

/*
 * Copia o Minecraft 1.12.2 JA REMAPEADO para a pasta ModBetterSearch, onde eu consigo pegar.
 * Com esse jar eu rodo javap e descubro a forma REAL de GuiContainerCreative, SearchTree,
 * GuiRecipeBook e companhia - em MCP - antes de escrever qualquer mixin.
 *
 * Copia na mao no doLast, e nao com a tarefa Copy: a Copy declara o destino como saida,
 * calcula hash de tudo que ja existe la (a pasta ModBetterSearch inteira) e morre no
 * .gradle/checksums/checksums.lock. Ja aconteceu; nao repete.
