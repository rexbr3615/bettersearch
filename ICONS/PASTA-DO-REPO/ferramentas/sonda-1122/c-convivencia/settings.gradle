/*
 * Sonda C: a pergunta que A e B nao respondem.
 *
 * No projeto de verdade, o modulo da 1.12.2 vai viver no MESMO settings.gradle que os outros
 * dezoito - que usam Fabric Loom, Architectury Loom e ModDevGradle. Aqui estao o RFG (1.12.2)
 * e o Fabric Loom (1.16.5, ja provado nesta maquina) lado a lado, num build so.
 *
 *   PASSA  -> a 1.12.2 entra no build principal: um `gradlew :versions:mc1_12_2:forge:build`
 *             como qualquer outra versao.
 *   FALHA  -> a 1.12.2 vira um sub-build separado com wrapper proprio. Funciona igual para
 *             voce (o publicar-1122.ps1 esconderia isso), so muda a encanacao por dentro.
 */
pluginManagement {
    repositories {
        maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
        gradlePluginPortal()
        /*
         * O RFG NAO esta no portal do Gradle nem em maven.gtnewhorizons.com/releases - a
         * primeira rodada provou os dois 404s. Ele mora no NEXUS da GTNH. Endereco copiado
         * do settings.gradle do template 1.12.2 da CleanroomMC, o mesmo que usa a 2.0.2.
         */
        maven {
            name = 'GTNH Nexus'
            url = 'https://nexus.gtnewhorizons.com/repository/public/'
            mavenContent {
                includeGroup 'com.gtnewhorizons'
                includeGroup 'com.gtnewhorizons.retrofuturagradle'
            }
        }
        mavenCentral()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'sonda-c-convivencia-1122'
include 'rfg-1122', 'fabric-1165'
