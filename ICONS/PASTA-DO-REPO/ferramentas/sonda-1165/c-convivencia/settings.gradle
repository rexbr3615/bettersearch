/*
 * Sonda C: a pergunta que as outras duas NAO respondem.
 *
 * A e B rodam cada uma sozinha. Mas no mod de verdade os dois modulos da 1.16.5 vao viver no
 * MESMO build, ao lado dos outros 16. E o Architectury Loom escolhe Forge ou Fabric por uma
 * PROPRIEDADE - loom.platform - que, num build de varios modulos, corre o risco de valer para
 * todos ao mesmo tempo. Se ela vazar, os 8 modulos Fabric que ja funcionam passam a achar que
 * sao Forge, e o mod inteiro para de compilar.
 *
 * Entao aqui estao os dois lado a lado, um Forge e um Fabric, sob um settings.gradle so. Se
 * este passar, a 1.16.5 entra no projeto sem risco para o que ja existe.
 */
pluginManagement {
    repositories {
        maven { name = 'Architectury'; url = 'https://maven.architectury.dev/' }
        maven { name = 'Fabric';       url = 'https://maven.fabricmc.net/' }
        maven { name = 'Forge';        url = 'https://maven.minecraftforge.net/' }
        gradlePluginPortal()
        mavenCentral()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'sonda-c-convivencia'
include 'forge-1165', 'fabric-1165'

/*
 * Marca a plataforma POR MODULO, e nao no gradle.properties da raiz.
 *
 * O beforeProject roda antes de o modulo ser avaliado - ou seja, antes de o plugin do Loom
 * ser aplicado e ler a propriedade. E o unico ponto em que da para separar os dois sem
 * depender de o Gradle ler um gradle.properties de subpasta (o que ele nem sempre faz).
 */
gradle.beforeProject { projeto ->
    if (projeto.name == 'forge-1165') {
        projeto.ext['loom.platform'] = 'forge'
    }
}
