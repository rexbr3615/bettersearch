pluginManagement {
    repositories {
        maven { name = 'Architectury'; url = 'https://maven.architectury.dev/' }
        maven { name = 'Fabric';       url = 'https://maven.fabricmc.net/' }
        maven { name = 'Forge';        url = 'https://maven.minecraftforge.net/' }
        gradlePluginPortal()
        mavenCentral()
    }
}

// A OUTRA coisa que faltava. A 1.16.5 compila em Java 8, e nao ha JDK 8 nesta maquina. Este
// plugin e o que deixa o Gradle BAIXAR o JDK sozinho - o settings.gradle do mod ja tem ele,
// e eu esqueci de trazer para a sonda. Sem ele o erro e "Toolchain download repositories have
// not been configured", que tambem nao e incompatibilidade nenhuma.
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'sonda-a-archloom-forge'
