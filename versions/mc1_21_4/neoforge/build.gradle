plugins {
    id 'java-library'
    id 'net.neoforged.moddev'
    id 'idea'
}

version = mod_version
group = mod_group_id
base.archivesName = "${mod_id}-neoforge-${minecraft_version_2114}"

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

/*
 * O codigo compartilhado NAO e um subprojeto separado: ele entra aqui como pasta de fonte
 * e e compilado direto dentro deste jar.
 *
 * Foi de proposito. A alternativa (um projeto 'core' com dependencia entre projetos) exigiria
 * shadow ou jarJar para embutir as classes no jar final, e qualquer erro nisso so aparece em
 * tempo de execucao, com o mod ja no jogo. Assim o jar sai auto-suficiente e o que compilou,
 * rodou.
 */
sourceSets {
    main {
        java.srcDir rootProject.file('core/src/main/java')
        java.srcDir file('../common/src/main/java')
        /*
         * Esboco de compilacao do evento de reload VELHO da linha 21.4 (o 21.4.157 o
         * REMOVEU do jar - por isso nao ha colisao de classe ao compilar junto). Ele
         * compila com o classpath completo do main e e BARRADO na porta do jar logo
         * abaixo, com trava que quebra o build se vazar. Veja o comentario no esboco.
         */
        java.srcDir file('src/neoApi/java')
        resources.srcDir file('../common/src/main/resources')
    }
}

repositories {
    maven { name = 'Shedaniel'; url = 'https://maven.shedaniel.me/' }
    maven { name = 'EMI'; url = 'https://maven.terraformersmc.com/releases' }
    maven { name = 'BlameJared'; url = 'https://maven.blamejared.com/' }
    mavenCentral()
}

dependencies {

    // Gancho da busca do REI. So compilacao: mira em classes internas dele e o
    // jar dele nunca entra no nosso.
    // compileOnly basta: aqui o jar ja vem em nomes da Mojang.
    compileOnly("me.shedaniel:RoughlyEnoughItems-neoforge:${rei_version_2114}") { transitive = false }
    // Gancho da busca do EMI, so nas duas versoes onde o EMI existe.
    // Aqui e compileOnly puro, igual ao JEI logo abaixo: o moddev do neoforge nao remapeia
    // nada, o jar ja vem em nomes da Mojang, e modCompileOnly nem existe nesse plugin.
    compileOnly("dev.emi:emi-neoforge:${emi_version}") { transitive = false }
    // Gancho da busca do JEI. So compilacao: mira em classe interna dele, que nao esta na
    // API publica, e o jar dele nunca entra no nosso.
    // compileOnly basta: neoforge e o fabric da 26.x ja entregam o jar em nomes da Mojang.
    compileOnly("mezz.jei:jei-${jei_mc_2114}-neoforge:${jei_version_2114}") { transitive = false }
}

neoForge {
    version = project.neo_version_2114

    runs {
        client {
            client()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: project.version
    }
}

jar {
    manifest {
        attributes([
                'Specification-Title'     : mod_name,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : project.version,
                'Implementation-Title'    : mod_name,
                'Implementation-Version'  : project.version,
                'Implementation-Vendor'   : mod_authors
        ])
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

tasks.named('jar') {
    // O esboco (net/neoforged/...) JAMAIS pode entrar no jar: nos builds velhos da linha a
    // classe real existe e a nossa copia falsa a sombrearia. Exclui e confere de verdade.
    exclude 'net/**'
    doLast {
        def sobras = []
        new java.util.zip.ZipFile(archiveFile.get().asFile).withCloseable { zip ->
            zip.entries().each { if (it.name.startsWith('net/')) sobras << it.name }
        }
        if (!sobras.isEmpty()) {
            throw new GradleException("esboco vazou para o jar: " + sobras)
        }
    }
}
