modLoader = "javafml"
loaderVersion = "[1,)"
license = "MIT"
issueTrackerURL = "https://github.com/rivalzin/BetterSearch/issues"

[[mods]]
modId = "bettersearch"
version = "${version}"
displayName = "Better Search"
authors = "rivalzin"
displayURL = "https://www.youtube.com/@Rivalzln"
logoFile = "SearchIconNEWICON512x512.png"
# Pixel art: sem suavizacao, para o icone ficar nitido na lista de mods.
logoBlur = false
description = '''
Makes search bars smarter and better!
'''

# Client-only: o mod nao precisa estar no servidor.
[[mixins]]
config = "bettersearch.mixins.json"

# Gancho no JEI. O plugin dentro dele devolve false quando o JEI nao esta instalado,
# entao sem JEI nada aqui e sequer carregado.
[[mixins]]
config = "bettersearch-jei.mixins.json"

# Gancho no EMI. Mesmo esquema: o plugin devolve false quando o EMI nao esta la.
[[mixins]]
config = "bettersearch-emi.mixins.json"

# Gancho no REI. Mesmo esquema: o plugin devolve false quando o REI nao esta la.
[[mixins]]
config = "bettersearch-rei.mixins.json"

[[dependencies.bettersearch]]
modId = "neoforge"
type = "required"
# So a linha 21.4 (= Minecraft 1.21.4). Um limite superior AQUI nao e frescura: sem ele o
# NeoForge deixa o mod carregar em 1.21.4, 26.1, no que vier - e ai os mixins nao acham os
# alvos e o jogo quebra na cara do jogador. Cada versao portada ganha o proprio jar.
# A linha 21.4 INTEIRA, das betas de dezembro de 2024 ao 21.4.157 de 2026. Da para
# prometer a linha toda porque o mod nao toca em nada que mudou dentro dela: as classes
# do Minecraft sao as mesmas em todo build (o jogo e um so, 1.21.4), e o unico ponto do
# NeoForge que mudou no meio (o evento de reload, renomeado) foi trocado por registro
# direto no ReloadableResourceManager do jogo - que existe igual em todos.
versionRange = "[21.4.0-beta,21.5)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.bettersearch]]
modId = "minecraft"
type = "required"
# Verificado no 1.21.4 e so nele. O 1.21 (.0) quase certamente serve tambem, mas "quase
# certamente" nao entra em arquivo de compatibilidade sem uma build de confirmacao.
versionRange = "[1.21.4,1.21.5)"
ordering = "NONE"
side = "CLIENT"
