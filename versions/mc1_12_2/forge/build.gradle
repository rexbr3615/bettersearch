plugins {
    id 'java'
    /*
     * RetroFuturaGradle: a UNICA ferramenta que monta a 1.12.2 em Gradle 9 - provado pela
     * sonda-1122 nesta maquina, nao lido em documentacao:
     *
     *   - o Architectury Loom exige o forge-*-userdev.jar, que NUNCA foi publicado para a
     *     1.12.2 (404 no maven da Forge; o que ha e o userdev3, formato que o RFG consome);
     *   - o RFG 2.x mora no nexus da GTNH (nao no portal do Gradle) e e compilado para
     *     Java 25 - por isso o gradle/gradle-daemon-jvm.properties da raiz pede o daemon 25;
     *   - o RFG escolhe sozinho o Forge de desenvolvimento 14.23.5.2847, o unico build da
     *     1.12.2 com userdev republicado. Em producao qualquer 14.23.5.28xx serve.
     */
    id 'com.gtnewhorizons.retrofuturagradle' version '2.0.2'
}

version = mod_version
group = mod_group_id
base.archivesName = "${mod_id}-forge-1.12.2"

// 1.12.2 roda em Java 8. O proprio Gradle baixa o JDK (foojay no settings.gradle).
java.toolchain.languageVersion = JavaLanguageVersion.of(8)

minecraft {
    mcVersion.set('1.12.2')
    // Abaixo da 1.14.4 nao existem mapeamentos da Mojang: aqui o mundo e MCP (stable_39).
    // Consequencia pratica: os nomes sao getMinecraft/GuiContainerCreative/searchField -
    // outra lingua. Todo alvo de gancho desta versao foi conferido com javap no jar
    // remapeado que a sonda exportou, nunca traduzido de cabeca das versoes novas.
    mcpMappingChannel.set('stable')
    mcpMappingVersion.set('39')
    username.set('rivalzin')
}

/*
 * Mesmo arranjo das outras oito versoes: o core/ (o algoritmo, Java 8 puro) e o common/
 * desta versao entram como pastas de fonte deste modulo. Nao ha subprojeto, nao ha shadow.
 */
sourceSets {
    main {
        java.srcDir rootProject.file('core/src/main/java')
        java.srcDir file('../common/src/main/java')
        /*
         * SEM resources do common aqui, de proposito. Os .lang e o icone ja moraram la e NAO
         * chegaram ao jar - a tela mostrou as chaves cruas enquanto o options.on do jogo
         * traduzia, a prova de que o problema era o empacotamento e nao a traducao. Em vez de
         * depurar o comportamento do RFG com srcDir de recursos, os arquivos MORAM na pasta
         * deste modulo, cuja inclusao e provada pelo proprio mcmod.info que sempre carregou.
         * Fato de disco em vez de comportamento do Gradle - regra antiga da casa.
         */
    }
    /*
     * Esbocos de compilacao do JEI 4.16 (e do fastutil que ele usa), em src/jeiApi/java.
     *
     * O JEI do pack e o 4.16.5.1027, que nao esta em Maven declaravel - mesma situacao do
     * 7.8.1.1019 na 1.16.5. La a saida foi apontar outra versao publicada; aqui nem isso:
     * o gancho usa classes INTERNAS (mezz.jei.suffixtree), e interno muda entre builds.
     * Entao compilamos contra esbocos lidos com javap do jar VERDADEIRO do usuario, membro
     * por membro (a secao 22 do tools/verify.sh reconfere todos contra esse jar).
     *
     * compileOnly do OUTPUT: os esbocos participam da compilacao e NUNCA do jar - se um
     * mezz/... nosso entrasse no jar, ele substituiria a classe real do JEI no jogo. O
     * publicar-1122.ps1 tem uma trava que reprova o jar se aparecer mezz/ ou it/ dentro.
     */
    jeiApi
}

dependencies {
    compileOnly sourceSets.jeiApi.output
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // Sem options.release: toolchain 8, o javac do 8 nao conhece a flag.
}
