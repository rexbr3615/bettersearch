plugins {
    // O mesmo plugin dos outros oito modulos Fabric. A sonda B provou que ele aceita a 1.16.5
    // e baixa os mapeamentos oficiais da Mojang.
    id 'net.fabricmc.fabric-loom-remap'
    id 'java-library'
    id 'idea'
}

version = mod_version
group = mod_group_id
base.archivesName = "${mod_id}-fabric-1.16.5"

java.toolchain.languageVersion = JavaLanguageVersion.of(8)

/*
 * Sem os ganchos do JEI e do REI nesta versao - eles estao em _integracoes-pendentes/, fora de
 * qualquer pasta de fonte. Detalhe proprio do Fabric na 1.16.5: o REI de la e a linha 5.12,
 * uma base de codigo anterior a reescrita da API (o Forge tem a 6.5, que ja e a moderna).
 * Sao integracoes diferentes, e nenhuma das duas esta feita ainda.
 */
sourceSets {
    main {
        java.srcDir rootProject.file('core/src/main/java')
        java.srcDir file('../common/src/main/java')
        resources.srcDir file('../common/src/main/resources')
    }
}

repositories {
    // Onde o Shedaniel publica o REI. Sem esta linha o Gradle procura o RoughlyEnoughItems-runtime
    // no Maven Central, no maven.fabricmc.net e no libraries.minecraft.net - e nao acha em lugar
    // nenhum, porque nenhum dos tres hospeda mod. Declarar a dependencia sem declarar o
    // repositorio dela e falha de configuracao: nao aparece em compilacao nenhuma, so quando o
    // Gradle vai baixar. E o que a secao 17 do verify.sh passou a cobrar.
    maven { name = 'Shedaniel'; url = 'https://maven.shedaniel.me/' }
    maven { name = 'TerraformersMC'; url = 'https://maven.terraformersmc.com/' }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:1.16.5"
    mappings loom.officialMojangMappings()


    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version_1165}"

    // Opcional: so o botao de config na lista de mods. O mod funciona sem ele.
    modCompileOnly "com.terraformersmc:modmenu:${modmenu_version_1165}"

    /*
     * REI da linha 5.x - a unica que existe para 1.16.5 no Fabric.
     *
     * Dois artefatos, e nao o jar "RoughlyEnoughItems" de cima: aquele e so um involucro com os
     * outros dentro (jar-in-jar), e o Gradle nao enxerga classe de jar aninhado. O -runtime traz
     * o EntryListWidget (onde fica o gancho) e o -api traz o EntryStack. Os dois estao
     * publicados separados no maven do Shedaniel - conferido no maven-metadata.xml de cada um.
     *
     * modCompileOnly e nao compileOnly: o jar chega em intermediary (net.minecraft.class_1799) e
     * quem traduz para ItemStack e o Loom. Com compileOnly puro o javac nao acha nada.
     */
    /*
     * transitive = false: pegamos SO estes dois jars, sem a arvore de dependencias deles.
     *
     * O jar publicado do REI carrega dentro cloth-client-events-v0 e fabric-api-base, e o POM
     * dele provavelmente lista esses (nao consegui ler o POM para ter certeza - o maven do
     * Shedaniel entrega o arquivo como binario). Se listar algo que more num repositorio que
     * este modulo nao declara, o build para de novo com "Could not find", exatamente como parou
     * agora com o proprio REI.
     *
     * Cortar a arvore aqui e seguro, e isto foi conferido e nao suposto: a cadeia de tipos que
     * o nosso codigo encosta e
     *     EntryListWidget (runtime) -> WidgetWithBounds (api) -> Widget (api)
     *         -> net.minecraft.class_362, do proprio Minecraft
     * e o EntryStack/EntryRegistry moram no -api. Nada fora destes dois jars mais o Minecraft
     * entra na compilacao - conferido com javap na hierarquia do jar de verdade.
     */
    modCompileOnly("me.shedaniel:RoughlyEnoughItems-runtime:${rei_version_1165}") { transitive = false }
    modCompileOnly("me.shedaniel:RoughlyEnoughItems-api:${rei_version_1165}") { transitive = false }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // Sem options.release: a toolchain e Java 8 e o javac do JDK 8 nao conhece --release.
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
