plugins {
    // A partir da 26.1 o Minecraft nao vem mais ofuscado: nao ha o que remapear, entao
    // quem serve e o Loom "puro". O jar sai da tarefa jar, e nao mais da remapJar.
    id 'net.fabricmc.fabric-loom'
    id 'java-library'
    id 'idea'
}

version = mod_version
group = mod_group_id
base.archivesName = "${mod_id}-fabric-${minecraft_version_261}"

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// Exatamente as mesmas pastas que o NeoForge compila - nem um arquivo a mais, nem um a menos.
sourceSets {
    main {
        java.srcDir rootProject.file('core/src/main/java')
        java.srcDir file('../common/src/main/java')
        resources.srcDir file('../common/src/main/resources')
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version_261}"

    /*
     * Nao ha linha de "mappings" aqui, e isso nao e esquecimento: a Mojang tirou a ofuscacao
     * na 26.1, entao os nomes ja sao os oficiais e nao existe mapeamento a escolher. Pelo
     * mesmo motivo as dependencias entram como implementation, e nao modImplementation.
     */
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version_261}"

    // Opcional: so para o botao de config na lista de mods. O mod funciona sem ele.
    compileOnly "com.terraformersmc:modmenu:${modmenu_version_261}"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

jar {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${mod_id}" }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
