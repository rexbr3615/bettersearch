plugins {
    // Versao ofuscada do Minecraft: quem serve e o plugin que remapeia.
    id 'net.fabricmc.fabric-loom-remap'
    id 'java-library'
    id 'idea'
}

version = mod_version
group = mod_group_id
base.archivesName = "${mod_id}-fabric-1.18.2"

// 1.18.2 roda em Java 17, nao 21. O Gradle baixa este JDK sozinho se voce nao tiver.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

/*
 * O core/ e o mesmo de sempre - o algoritmo nao muda em versao nenhuma.
 * O common/ e proprio desta linha: e a copia do 1.21.1 com as seis diferencas da 1.20.1
 * resolvidas (tooltip sem contexto, receita sem RecipeHolder, NBT no lugar de componentes,
 * ResourceLocation por construtor, roda do mouse de um eixo so, renderBackground de um
 * argumento). Cada uma esta comentada no ponto onde acontece.
 */
sourceSets {
    main {
        java.srcDir rootProject.file('core/src/main/java')
        java.srcDir file('../common/src/main/java')
        resources.srcDir file('../common/src/main/resources')
    }
}

repositories {
    maven { name = 'Shedaniel'; url = 'https://maven.shedaniel.me/' }
    maven { name = 'EMI'; url = 'https://maven.terraformersmc.com/releases' }
    // onde o JEI publica. so compilacao, o jar dele nao entra no nosso
    maven { name = 'BlameJared'; url = 'https://maven.blamejared.com/' }
    mavenCentral()
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/'
    }
}

dependencies {
    // Gancho da busca do REI. So compilacao: mira em classes internas dele e o
    // jar dele nunca entra no nosso.
    // modCompileOnly: o jar do REI chega em outro namespace e o plugin traduz.
    modCompileOnly("me.shedaniel:RoughlyEnoughItems-fabric:${rei_version_1182}")
    // Gancho da busca do EMI, so nas duas versoes onde o EMI existe. modCompileOnly
    // pelo mesmo motivo do JEI: o jar chega em outro namespace e precisa ser traduzido.
    // Aqui o artefato e "emi", nao "emi-fabric": na 1.18.2 o EMI ainda nao tinha versao de
    // Forge, entao nao havia sufixo de loader nenhum. Isso esta escrito no README do proprio
    // EMI, no ramo 1.18.2 do repositorio dele. Trocar por "emi-fabric" quebra a resolucao.
    modCompileOnly("dev.emi:emi:${emi_version_1182}")
    // Gancho da busca do JEI. So compilacao: mira em classe interna dele, que nao esta na
    // API publica, e o jar dele nunca entra no nosso.
    // modCompileOnly e nao compileOnly: aqui o jar do JEI chega em outro namespace (intermediary
    // no Fabric, SRG no Forge 1.20.1) e quem traduz para os nomes do ambiente e essa configuracao.
    // Com compileOnly puro o javac reclama de net.minecraft.class_2960 e nao compila.
    modCompileOnly("mezz.jei:jei-${jei_mc_1182}-fabric:${jei_version_1182}")
    minecraft "com.mojang:minecraft:1.18.2"
    // Mesmos mapeamentos oficiais do NeoForge: e o que permite os tres loaders compartilharem
    // o mesmo arquivo de codigo.
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version_1182}"

    // Opcional: so para o botao de config na lista de mods. O mod funciona sem ele.
    modCompileOnly "com.terraformersmc:modmenu:${modmenu_version_1182}"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
