plugins {
    // Versao ofuscada do Minecraft: quem serve e o plugin que remapeia.
    id 'net.fabricmc.fabric-loom-remap'
    id 'java-library'
    id 'idea'
}

version = mod_version
group = mod_group_id
base.archivesName = "${mod_id}-fabric-1.20.1"

// 1.20.1 roda em Java 17, nao 21. O Gradle baixa este JDK sozinho se voce nao tiver.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

/*
 * O core/ e o mesmo de sempre - o algoritmo nao muda em versao nenhuma.
 * O common/ e proprio desta linha: e a copia do 1.21.1 com as seis diferencas da 1.20.1
 * resolvidas (tooltip sem contexto, receita sem RecipeHolder, NBT no lugar de componentes,
 * ResourceLocation por construtor, roda do mouse de um eixo so, renderBackground de um
 * argumento). Cada uma esta comentada no ponto onde acontece.
 */
sourceSets {
    main {
        java.srcDir rootProject.file('core/src/main/java')
        java.srcDir rootProject.file('mc1_20_1/common/src/main/java')
        resources.srcDir rootProject.file('mc1_20_1/common/src/main/resources')
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:1.20.1"
    // Mesmos mapeamentos oficiais do NeoForge: e o que permite os tres loaders compartilharem
    // o mesmo arquivo de codigo.
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version_1201}"

    // Opcional: so para o botao de config na lista de mods. O mod funciona sem ele.
    modCompileOnly "com.terraformersmc:modmenu:${modmenu_version_1201}"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
