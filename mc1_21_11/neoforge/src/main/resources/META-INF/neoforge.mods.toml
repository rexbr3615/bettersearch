modLoader = "javafml"
loaderVersion = "[1,)"
license = "MIT"
issueTrackerURL = "https://github.com/rivalzin/BetterSearch/issues"

[[mods]]
modId = "bettersearch"
version = "${version}"
displayName = "Better Search"
authors = "rivalzin"
displayURL = "https://www.youtube.com/@Rivalzln"
logoFile = "SearchIconNEWICON512x512.png"
# Pixel art: sem suavizacao, para o icone ficar nitido na lista de mods.
logoBlur = false
description = '''
Makes search bars smarter and better!
'''

# Client-only: o mod nao precisa estar no servidor.
[[mixins]]
config = "bettersearch.mixins.json"

[[dependencies.bettersearch]]
modId = "neoforge"
type = "required"
# So a linha 21.11 (= Minecraft 1.21.11). Ela nao se junta a 1.21.9/1.21.10 porque a Mojang
# renomeou ResourceLocation para Identifier no jogo inteiro: sao dois binarios diferentes.
versionRange = "[21.11.0,21.12)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.bettersearch]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.11,1.21.12)"
ordering = "NONE"
side = "CLIENT"
