/*
 * Projetinho descartavel, separado do mod de proposito.
 *
 * Ele existe para uma coisa so: fazer o Gradle BAIXAR e desofuscar o Minecraft 1.19.2 e
 * 1.18.2, para eu conferir os ganchos contra o jar de verdade antes de escrever o port.
 *
 * Fica fora do settings.gradle da raiz, entao o `gradlew build` normal do mod nao enxerga
 * nada disto e continua funcionando igual. Quando o port estiver pronto, pode apagar a pasta.
 */
pluginManagement {
    plugins {
        id 'net.neoforged.moddev.legacyforge' version '2.0.143'
    }
    repositories {
        maven { name = 'NeoForged'; url = 'https://maven.neoforged.net/releases' }
        gradlePluginPortal()
        mavenCentral()
    }
}

rootProject.name = 'baixar-mc'
include 'mc1_19_2', 'mc1_18_2'
