plugins {
    // O MESMO plugin que a 1.20.1 do mod ja usa. A documentacao dele diz que cobre da 1.17
    // ate a 1.20.1 - rodar isto aqui e o que prova, na pratica, que a 1.18.2 esta dentro.
    id 'net.neoforged.moddev.legacyforge'
    id 'java-library'
}

// 1.18.2 roda em Java 17. O Gradle baixa este JDK sozinho se voce nao tiver.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

legacyForge {
    version = '1.18.2-40.3.11'
}

/*
 * A pasta src/ tem uma classe de uma linha so. Ela existe para o compileJava ter algo para
 * fazer: sem nenhuma fonte, o Gradle pula a compilacao e nem chega a montar o jar do
 * Minecraft - que e justamente o que a gente quer que ele monte.
 */
