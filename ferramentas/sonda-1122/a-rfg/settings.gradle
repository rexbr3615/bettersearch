pluginManagement {
    repositories {
        gradlePluginPortal()
        /*
         * O RFG NAO esta no portal do Gradle nem em maven.gtnewhorizons.com/releases - a
         * primeira rodada provou os dois 404s. Ele mora no NEXUS da GTNH. Endereco copiado
         * do settings.gradle do template 1.12.2 da CleanroomMC, o mesmo que usa a 2.0.2.
         */
        maven {
            name = 'GTNH Nexus'
            url = 'https://nexus.gtnewhorizons.com/repository/public/'
            mavenContent {
                includeGroup 'com.gtnewhorizons'
                includeGroup 'com.gtnewhorizons.retrofuturagradle'
            }
        }
        mavenCentral()
    }
}

// A 1.12.2 compila em Java 8; este plugin deixa o Gradle baixar o JDK sozinho.
// A falta dele ja custou uma rodada inteira na sonda da 1.16.5.
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'sonda-a-rfg'
