plugins {
    id 'java'
    /*
     * RetroFuturaGradle: a ferramenta da comunidade GTNH para montar 1.7.10/1.12.2 em Gradle
     * moderno. Tres fatos conferidos na fonte antes desta sonda existir:
     *
     *   - as notas da 2.0.0 (11/nov/2025) anunciam "Gradle 9 support, Java 25 requirement".
     *     O README que diz "gradle 7.6-8.8" descreve a linha 1.x, anterior;
     *   - o Java 25 e o que este projeto JA usa para rodar o Gradle (exigencia da linha 26.x);
     *   - o ID e a sintaxe abaixo vem do template 1.12.2 da CleanroomMC, nao de memoria.
     *
     * O que so esta maquina responde: se ele monta a 1.12.2 no Gradle 9.6.1 daqui.
     */
    id 'com.gtnewhorizons.retrofuturagradle' version '2.0.2'
}

// Quem compila e um JDK 8 baixado pelo foojay - mesmo desenho da 1.16.5.
java.toolchain.languageVersion = JavaLanguageVersion.of(8)

minecraft {
    mcVersion.set('1.12.2')
    /*
     * MCP stable_39: abaixo da 1.14.4 nao ha mapeamento da Mojang; e MCP ou nada. O artefato
     * de.oceanlabs.mcp:mcp_stable:39-1.12 existe no maven da Forge - conferido no
     * maven-metadata.xml de la, que so tem UMA versao contendo "1.12": a 39-1.12.
     */
    mcpMappingChannel.set('stable')
    mcpMappingVersion.set('39')
    username.set('Sonda')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // Sem options.release: toolchain 8, o javac do 8 nao conhece a flag. Licao da 1.16.5.
}

/*
 * Copia o Minecraft 1.12.2 JA REMAPEADO para a pasta ModBetterSearch, onde eu consigo pegar.
 * Com esse jar eu rodo javap e descubro a forma REAL de GuiContainerCreative, SearchTree,
 * GuiRecipeBook e companhia - em MCP - antes de escrever qualquer mixin.
 *
 * Copia na mao no doLast, e nao com a tarefa Copy: a Copy declara o destino como saida,
 * calcula hash de tudo que ja existe la (a pasta ModBetterSearch inteira) e morre no
 * .gradle/checksums/checksums.lock. Ja aconteceu; nao repete.
 */
tasks.register('exportarJar') {
    /*
     * dependsOn: a rodada 3 provou que sem isto o Gradle roda a exportacao ANTES de o
     * Minecraft ser montado - a tarefa listou o classpath cedo demais e copiou scala e
     * fastutil no lugar do jogo.
     */
    dependsOn tasks.named('compileJava')
    doLast {
        def destino = file('../../../../..')
        // Apaga os mc1122-* de rodadas anteriores: sobrou jar errado da rodada 3 la.
        destino.listFiles().findAll { it.name ==~ /mc1122-.*\.jar/ }.each { it.delete() }

        /*
         * Procura pelo CONTEUDO, nao pelo nome nem pelo tamanho: quem carrega
         * net/minecraft/client/Minecraft.class e o jogo, seja jar ou pasta de classes.
         * O RFG entrega o Minecraft recompilado como PASTA - o filtro anterior, so de
         * jars, nunca o veria. Pasta vira jar aqui mesmo (ant.zip) para viajar.
         */
        def marcador = 'net/minecraft/client/Minecraft.class'
        def jars = []
        def pastas = []
        sourceSets.main.compileClasspath.files.each { f ->
            if (f.isDirectory()) {
                if (new File(f, marcador).exists()) { pastas << f }
            } else if (f.name.endsWith('.jar')) {
                try {
                    def zf = new java.util.zip.ZipFile(f)
                    try { if (zf.getEntry(marcador) != null) { jars << f } } finally { zf.close() }
                } catch (ignorado) { }
            }
        }

        println ''
        println "destino: ${destino.absolutePath}"
        println "com ${marcador}: ${jars.size()} jar(s) e ${pastas.size()} pasta(s)"
        int n = 0
        jars.each { j ->
            def saida = new File(destino, "mc1122-a${++n}.jar")
            java.nio.file.Files.copy(j.toPath(), saida.toPath(),
                    java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            println String.format('  %-14s <- %s', saida.name, j.name)
        }
        pastas.each { d ->
            def saida = new File(destino, "mc1122-a${++n}.jar")
            ant.zip(destfile: saida, basedir: d)
            println String.format('  %-14s <- (pasta) %s', saida.name, d.absolutePath)
        }
        if (n == 0) {
            println 'NENHUM candidato com o marcador. Classpath completo para diagnostico:'
            sourceSets.main.compileClasspath.files.sort { -it.length() }.each {
                println String.format('  %s%s', it.isDirectory() ? '[dir] ' : '', it.absolutePath)
            }
        }
    }
}
