plugins {
    id 'dev.architectury.loom' version '1.17.491'
    id 'java-library'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(8)

repositories {
    maven { name = 'Forge'; url = 'https://maven.minecraftforge.net/' }
    mavenCentral()
}

dependencies {
    minecraft 'com.mojang:minecraft:1.16.5'

    /*
     * O ponto da sonda inteira: mapeamentos OFICIAIS da Mojang nos dois loaders. E o que
     * permite um codigo so servir ao Forge e ao Fabric.
     *
     * O metodo mora na extensao do plugin, e o NOME dessa extensao mudou de "minecraft" para
     * "loom" ao longo da vida do Loom. O exemplo oficial do Architectury (da epoca da 1.17.1)
     * usa minecraft.officialMojangMappings(); o Fabric Loom moderno usa loom.<mesma coisa>.
     * Em vez de apostar em um dos dois, pergunto ao projeto qual existe. Custa uma linha e
     * nao tem como estar errado.
     */
    def ext = project.extensions.findByName('loom') ?: project.extensions.getByName('minecraft')
    mappings ext.officialMojangMappings()

    // "required when using Forge Loom in forge mode", segundo o exemplo oficial.
    forge 'net.minecraftforge:forge:1.16.5-36.2.42'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    /*
     * NAO usar options.release aqui.
     *
     * A flag --release nasceu no JDK 9. Como a toolchain acima e Java 8, quem compila e o
     * javac do JDK 8 - e ele responde "invalid flag: --release" e para antes de compilar
     * qualquer coisa. Foi exatamente isso que derrubou as tres sondas na segunda rodada.
     *
     * Com a toolchain em 8 nao ha o que configurar: o proprio compilador ja e da versao
     * certa, e o bytecode sai em Java 8 por construcao.
     */
}

/*
 * Copia o Minecraft 1.16.5 JA DESOFUSCADO para a pasta ModBetterSearch, onde eu consigo pegar.
 *
 * E o que falta para eu escrever o port sem chutar: com esse jar eu rodo javap nas tres classes
 * que o mod ataca com mixin e descubro a assinatura REAL de cada alvo na 1.16.5 - do mesmo jeito
 * que foi feito na 1.18.2, onde o updateCollections chamava MutableSearchTree e nao SearchTree.
 *
 * NAO usa a tarefa Copy do Gradle de proposito. A Copy declara o destino como saida e, para
 * saber se esta em dia, calcula o hash de TUDO que ja existe la dentro. Como o destino aqui e a
 * ModBetterSearch, que contem o projeto inteiro, ela esbarra no .gradle/checksums/checksums.lock
 * - um arquivo travado pelo proprio Gradle - e morre com "Cannot access a file in the destination
 * directory". Copiando na mao no doLast nao ha saida declarada, nao ha hash de destino, nao ha
 * problema.
 *
 * Imprime o classpath INTEIRO tambem: se o filtro nao pegar o jar certo, a lista impressa ja
 * diz qual e o nome dele e a gente resolve sem mais uma rodada.
 */
tasks.register('exportarJar') {
    doLast {
        // cinco niveis acima daqui = a pasta ModBetterSearch, independente do nome que voce deu
        // as pastas intermediarias.
        def destino = file('../../../../..')
        def entradas = sourceSets.main.compileClasspath.files.findAll { it.name.endsWith('.jar') }

        println ''
        println "destino: ${destino.absolutePath}"
        println ''
        println '--- classpath de compilacao desta sonda (o que o Sonda.java enxergou) ---'
        entradas.sort { -it.length() }.each {
            println String.format('  %,13d bytes  %s', it.length(), it.name)
        }

        // O jar do Minecraft e, de longe, o maior: dezenas de MB contra alguns KB das
        // bibliotecas. Pegar por tamanho e mais confiavel do que adivinhar o nome, que muda
        // conforme o plugin e a versao.
        def escolhidos = entradas.findAll { arquivo ->
            def nome = arquivo.name.toLowerCase()
            arquivo.length() > 5_000_000 || nome.contains('minecraft') || nome.contains('1.16.5')
        }

        println ''
        if (escolhidos.isEmpty()) {
            println 'NAO achei nenhum jar candidato. Me manda a lista acima que eu digo qual e.'
            return
        }

        println '--- copiados ---'
        escolhidos.eachWithIndex { arquivo, i ->
            // Nome curto e previsivel: a ponte que traz o arquivo ate mim tem limite de
            // tamanho de caminho, e nome de jar do Loom costuma ser quilometrico.
            def saida = new File(destino, "mc165-${i + 1}.jar")
            java.nio.file.Files.copy(arquivo.toPath(), saida.toPath(),
                    java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            println String.format('  %-12s <- %s', saida.name, arquivo.name)
        }
        println ''
    }
}
