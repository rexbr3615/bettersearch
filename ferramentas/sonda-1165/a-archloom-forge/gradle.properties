# ESTA LINHA e o que faltava na primeira tentativa da sonda.
#
# O Architectury Loom decide se vai montar Fabric ou Forge por esta propriedade, e nao pelo
# que voce escreve no build.gradle. Sem ela o plugin sobe em modo Fabric, a configuracao
# "forge" nem chega a existir, e o erro que aparece e "Could not find method forge()" - que
# parece incompatibilidade e nao e: e configuracao faltando.
#
# Conferido no gradle.properties do exemplo oficial do proprio Architectury
# (github.com/architectury/archloom-example-mod), nao deduzido.
loom.platform=forge
