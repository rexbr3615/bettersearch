pluginManagement {
    repositories {
        maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
        gradlePluginPortal()
        mavenCentral()
    }
}

// Faltava so isto. Na primeira rodada o Loom 1.17.17 aceitou a 1.16.5, baixou os mapeamentos
// da Mojang e chegou ate o compileJava - parou porque nao ha JDK 8 na maquina e a sonda nao
// sabia baixar um. Ou seja: o plugin nunca reclamou da versao. Foi a minha sonda que faltou.
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'sonda-b-loom-fabric'
