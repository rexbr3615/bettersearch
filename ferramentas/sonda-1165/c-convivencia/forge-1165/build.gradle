plugins {
    id 'dev.architectury.loom' version '1.17.491'
    id 'java-library'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(8)

repositories {
    maven { name = 'Forge'; url = 'https://maven.minecraftforge.net/' }
    mavenCentral()
}

dependencies {
    minecraft 'com.mojang:minecraft:1.16.5'
    def ext = project.extensions.findByName('loom') ?: project.extensions.getByName('minecraft')
    mappings ext.officialMojangMappings()
    forge 'net.minecraftforge:forge:1.16.5-36.2.42'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    /*
     * NAO usar options.release aqui.
     *
     * A flag --release nasceu no JDK 9. Como a toolchain acima e Java 8, quem compila e o
     * javac do JDK 8 - e ele responde "invalid flag: --release" e para antes de compilar
     * qualquer coisa. Foi exatamente isso que derrubou as tres sondas na segunda rodada.
     *
     * Com a toolchain em 8 nao ha o que configurar: o proprio compilador ja e da versao
     * certa, e o bytecode sai em Java 8 por construcao.
     */
}
