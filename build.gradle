plugins {
    id 'base'
}

/*
 * Teste do motor de busca SEM Minecraft e SEM loader.
 *
 *   ./gradlew coreTest
 *
 * Compila so o core/ (Java puro) mais o tools/BetterSearchCoreTest.java e roda as 146
 * verificacoes: acentos, erro de digitacao, outros idiomas, correcao de comandos, apelidos
 * secretos. Como nao depende de versao nem de loader, este mesmo teste vale para TODOS os
 * ports - e e a primeira coisa a rodar depois de mexer no algoritmo.
 */
def coreTestDir = layout.buildDirectory.dir('coreTest')

tasks.register('compileCoreTest', JavaCompile) {
    group = 'verification'
    description = 'Compila o nucleo de busca e o teste, sem Minecraft.'
    source = fileTree('core/src/main/java/com/rivalzin/bettersearch/core') + fileTree('tools')
    include '**/*.java'
    classpath = files()
    destinationDirectory = coreTestDir
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.register('coreTest', JavaExec) {
    group = 'verification'
    description = 'Roda os testes do motor de busca (nao precisa do Minecraft).'
    dependsOn 'compileCoreTest'
    classpath = files(coreTestDir)
    mainClass = 'com.rivalzin.bettersearch.tools.BetterSearchCoreTest'
    jvmArgs = ['-Dfile.encoding=UTF-8']
}

/*
 * Junta os jars de todos os loaders em build/dist, para nao ter de cacar um por um.
 *
 *   ./gradlew dist
 */
tasks.register('dist', Copy) {
    group = 'build'
    description = 'Constroi todos os loaders e junta os jars em build/dist.'
    // Uma linha por alvo. Ao acrescentar uma versao, some o caminho dela aqui.
    dependsOn ':mc1_21_1:neoforge:build', ':mc1_21_1:fabric:build',
              ':mc1_21_9:neoforge:build', ':mc1_21_9:fabric:build',
              ':mc1_21_11:neoforge:build', ':mc1_21_11:fabric:build',
              ':mc26_1:neoforge:build', ':mc26_1:fabric:build',
              ':mc26_2:neoforge:build', ':mc26_2:fabric:build',
              ':mc1_20_1:fabric:build', ':mc1_20_1:forge:build'
    from files('mc1_21_1/neoforge/build/libs', 'mc1_21_1/fabric/build/libs',
               'mc1_21_9/neoforge/build/libs', 'mc1_21_9/fabric/build/libs',
               'mc1_21_11/neoforge/build/libs', 'mc1_21_11/fabric/build/libs',
               'mc26_1/neoforge/build/libs', 'mc26_1/fabric/build/libs',
               'mc26_2/neoforge/build/libs', 'mc26_2/fabric/build/libs',
               'mc1_20_1/fabric/build/libs', 'mc1_20_1/forge/build/libs')
    into layout.buildDirectory.dir('dist')
    include '*.jar'
    exclude '*-sources.jar', '*-dev.jar', '*-dev-shadow.jar'
}
